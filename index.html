<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Form</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:420px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.3);

    box-shadow:
        0 25px 45px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.5);

    transform-style:preserve-3d;
    perspective:1000px;
    transition:.5s;
}

.container:hover{
    transform:
        rotateX(8deg)
        rotateY(-8deg)
        translateY(-10px);
}

h2{
    text-align:center;
    color:white;
    font-size:32px;
    margin-bottom:25px;
    text-shadow:0 3px 12px rgba(0,0,0,.3);
}

input,
select,
textarea{
    width:100%;
    padding:14px 18px;
    margin:12px 0;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:16px;
    outline:none;
    transition:.4s;
    backdrop-filter:blur(10px);
}

input::placeholder,
textarea::placeholder{
    color:#f1f1f1;
}

select{
    color:white;
}

option{
    color:black;
}

input:focus,
textarea:focus,
select:focus{
    background:rgba(255,255,255,.3);
    transform:translateZ(15px) scale(1.02);
    box-shadow:0 0 18px rgba(255,255,255,.4);
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#00dbde,#fc00ff);
    transition:.4s;
    box-shadow:0 12px 25px rgba(0,0,0,.35);
}

button:hover{
    transform:
        translateY(-6px)
        scale(1.03);

    box-shadow:
        0 20px 35px rgba(0,0,0,.4);
}

button:active{
    transform:scale(.98);
}

#status{
    margin-top:20px;
    color:white;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.container::before{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    background:rgba(255,255,255,.25);
    border-radius:50%;
    top:-60px;
    left:-60px;
    filter:blur(15px);
}

.container::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    background:rgba(255,255,255,.18);
    border-radius:50%;
    bottom:-50px;
    right:-50px;
    filter:blur(20px);
}
</style>

</head>
<body>

<div class="container">

    <h2>Feedback Form</h2>

    <form id="feedbackForm">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <select name="rating" required>
            <option value="">Rate Us</option>
            <option>⭐⭐⭐⭐⭐ Excellent</option>
            <option>⭐⭐⭐⭐ Good</option>
            <option>⭐⭐⭐ Average</option>
            <option>⭐⭐ Poor</option>
            <option>⭐ Very Bad</option>
        </select>

        <textarea
            name="message"
            rows="6"
            placeholder="Write your feedback..."
            required
        ></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <p id="status"></p>

</div>

<script>
emailjs.init("q3jEjPxTyzhf_ETUQ");

document
.getElementById("feedbackForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    emailjs.sendForm(
        "service_9vrxg8e",
        "template_urwco6m",
        this
    )
    .then(function(){

        document.getElementById("status").innerHTML =
        "✅ Feedback Sent Successfully!";

        document.getElementById("feedbackForm").reset();

    })
    .catch(function(error){

        document.getElementById("status").innerHTML =
        "❌ Failed to send feedback.";

        console.log(error);

    });

});
</script>

</body>
</html>
